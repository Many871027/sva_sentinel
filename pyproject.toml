[project]
name = "sva-sentinel"
version = "0.1.0"
description = "SVA Residential Traffic & Micromobility Safety Sentinel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "opencv-python-headless>=4.10.0",
    "openvino>=2024.4.0",
    "llama-cpp-python>=0.3.0",
    "mlflow>=2.17.0",
    "supervision>=0.24.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "huggingface-hub>=0.25.0",
]

[project.scripts]
sva-ingest = "src.pipeline.dataset_ingest:main"
sva-curate = "src.pipeline.dataset_curation:main"
sva-split = "src.pipeline.dataset_split:main"
sva-download-models = "src.engine.download_base_models:main"
sva-distill = "src.engine.distillation_trainer:main"
sva-distill-loss = "src.engine.distillation_loss:main"
sva-export-onnx = "src.engine.onnx_exporter:main"
sva-generate-telemetry = "src.pipeline.telemetry_generator:main"
sva-finetune-auditor = "src.engine.auditor_finetuning:main"
sva-export-gguf = "src.engine.gguf_converter:main"
sva-quantize-openvino = "src.engine.openvino_quantizer:main"
sva-benchmark-openvino = "src.engine.openvino_benchmark:main"
sva-quantize-gguf = "src.engine.llamacpp_quantizer:main"
sva-benchmark-auditor = "src.engine.auditor_benchmark:main"
sva-evaluate-auditor = "src.engine.auditor_case_evaluator:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
